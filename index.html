</style></head><body>
<div id="ui">
  <button id="walk" class="on">🚶 Rundgang</button>
  <button id="top">🗺 Draufsicht</button>
  <button id="cones" class="on">Sichtfelder</button>
  <button id="liste">📋 Liste</button>
  <button id="reset">↺ Neustart</button>
  <button id="place">➕ Kamera setzen</button>
  <select id="camsel"><option value="">📷 Kamerablick …</option></select>
</div>
<div id="stick"><div id="knob"></div></div>

</div>
